name: Cihaz testleri

# Gerçek Android emülatöründe kabul testleri: şifreli depo, açık rıza,
# adet girişi, hızlı kayıt, tarif defteri, ansiklopedi, asistan, yedek.
on:
  push:
    branches: [claude/tum-duzeltmeler]
    paths: ['lib/**', 'integration_test/**', 'android/**', 'pubspec.yaml', '.github/workflows/cihaz_testleri.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cihaz-testleri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    name: Android ${{ matrix.api }} (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            profile: pixel_6
          - api: 29
            profile: Nexus 5X
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Disk alanı
        run: sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell /opt/ghc
      - name: KVM izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Kabul testleri (emülatör)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          disable-animations: true
          script: |
            set -o pipefail
            flutter test integration_test/device_acceptance_test.dart -d emulator-5554 --reporter expanded 2>&1 | tee /tmp/cihaz.log
