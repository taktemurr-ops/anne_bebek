name: Ekran görüntüleri

# Tasarım incelemesi: ana ekranların PNG görüntülerini üretir ve
# 'ekran-goruntuleri' dalına yazar (yalnızca görüntüler; kaynak kod değil).
on:
  push:
    branches: [claude/tum-duzeltmeler]
    paths: ['lib/**', 'integration_test/screenshots/**', '.github/workflows/screens.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screens
  cancel-in-progress: true

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Görüntüleri üret
        run: flutter test integration_test/screenshots --update-goldens || true
      - name: Görüntüleri dala yaz
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p /tmp/shots
          cp integration_test/screenshots/goldens/*.png /tmp/shots/ 2>/dev/null || true
          ls -la /tmp/shots
          cd /tmp/shots
          echo "Kaynak: ${GITHUB_SHA}" > KAYNAK.txt
          git init -q
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Ekran görüntüleri ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ekran-goruntuleri
