name: Flutter CI

on:
  push:
    branches: [main, 'feature/gp02-*']
  pull_request:
    branches: [main, 'feature/gp01-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-check:
    name: Flutter Analyze, Test ve APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.9 kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Flutter surumunu kontrol et
        run: flutter --version

      - name: Bagimliliklari yukle
        run: flutter pub get

      - name: Flutter analiz
        run: flutter analyze

      - name: Flutter testleri
        run: flutter test

      - name: Android APK olustur
        run: flutter build apk --debug

      - name: APK dosyasini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: anne-bebek-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  gp01-android-emulator:
    name: Android emulatorde ekran ve kayit testi
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/gp01-') || startsWith(github.head_ref, 'feature/gp02-'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: gp-android-${{ github.head_ref }}
      cancel-in-progress: false

    steps:
      - name: Kaynak kodlarini indir
        uses: actions/checkout@v4

      - name: Java 17 kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter 3.47.9 kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Bagimliliklari yukle
        run: flutter pub get

      - name: Android emulator icin disk alani ac
        run: |
          df -h
          # Preserve Android SDK/NDK/CMake to avoid costly reinstall during Gradle build.
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell /opt/ghc
          df -h

      - name: Android sanallastirma izinleri
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator temel smoke testleri
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test/gp01_smoke_test.dart -d emulator-5554
