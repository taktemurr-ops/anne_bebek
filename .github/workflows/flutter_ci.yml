name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  flutter-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kurulumu
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter surumu
        run: flutter --version

      - name: Paketleri yukle
        run: flutter pub get

      - name: Flutter analiz
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Android APK derleme
        run: flutter build apk --debug
