name: Release derlemeleri

# Final APK/AAB, web ve iOS (imzasız) derlemeleri.
# Android release imzası için GitHub > Settings > Secrets and variables > Actions:
#   ANDROID_KEYSTORE_BASE64   keystore dosyasının base64 hâli
#   ANDROID_KEYSTORE_PASSWORD keystore parolası
#   ANDROID_KEY_ALIAS         anahtar adı (ör. upload)
#   ANDROID_KEY_PASSWORD      anahtar parolası
# Bu sırlar yoksa Android derlemesi debug anahtarıyla imzalanır ve
# "test-imzali" adıyla saklanır; mağazaya yüklenemez.

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release APK ve AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Release imza anahtarını hazırla
        if: env.HAS_SIGNING == 'true'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Release APK ve AAB derle
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$HAS_SIGNING" != "true" ]; then
            echo "::warning::Release imza sırları tanımlı değil; APK yalnızca test amaçlı debug anahtarıyla imzalanır."
          fi
          flutter build apk --release
          flutter build appbundle --release

      - name: İmzayı doğrula
        shell: bash
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee /tmp/imza.txt
          if [ "$HAS_SIGNING" = "true" ] && grep -q "CN=Android Debug" /tmp/imza.txt; then
            echo "::error::Release APK debug anahtarıyla imzalanmış."; exit 1
          fi

      - name: Android çıktılarını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.HAS_SIGNING == 'true' && 'anne-bebek-android-release' || 'anne-bebek-android-test-imzali' }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

  web:
    name: Web derlemesi
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: anne-bebek-web
          path: build/web
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS derlemesi (imzasız)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: iOS release derle (imzasız; App Store için Apple hesabıyla imzalanmalı)
        run: flutter build ios --release --no-codesign
